server {
	listen       9001;
        listen       [::]:9001;
        server_name  ~^(?<subdomain>[^.]+).(?<domain>[^$]+);
        server_tokens  off;

        include /etc/nginx/sites-multiple/api/serverIPset.conf;       

	access_log   off;

        #Load configuration files for the default server block.
        #include /etc/nginx/default.d/*.conf;

	include /etc/nginx/sites-multiple/api/rewriteErrorPage.conf;
	include /etc/nginx/sites-multiple/api/devicedetector.conf;

        if ($http_user_agent ~* "Mobile|iP(hone|od|ad)|Android|BlackBerry|IEMobile|Kindle|NetFront|Silk-Accelerated|(hpw|web)OS|Fennec|Minimo|Opera M(obi|ini)|Blazer|Dolfin|Dolphin|Skyfire|Zune") {
                set $Device Mobile;
        }

        if ($Device = Desktop ) {
                rewrite ^(.*)$ https://release.$domain$1 break;
        }

        location / {
                root   /var/www/$name/releaseMobile/;
                index  index.html index.htm;
                try_files $uri $uri/ /index.html;
        }

        include /etc/nginx/sites-multiple/api/dockerApi.conf;

        # redirect server error pages to the static page /40x.html

#        error_page 404 /404.html;
        location = /40x.html {
#		root   /usr/share/nginx/html;
        }

        # redirect server error pages to the static page /50x.html

#        error_page 500 502 504 /50x.html;
        location = /50x.html {
#		root /usr/share/nginx/html;
        }

#	error_page 503 /underMaintenance/index_$dirname.html;
        location /underMaintenance/ {
#		root /var/www/$name/;
        }
}

