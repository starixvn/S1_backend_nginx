server {
	listen       7000;
        listen       [::]:7000;
        server_name  ~^(?<subdomain>[^.]+).(?<domain>[^$]+);
#	server_name  adminstag.n88dev.com;
        server_tokens  off;
        access_log   off;
	#Load configuration files for the default server block.
        #include /etc/nginx/default.d/*.conf;

#	include sites-multiple/api/devicedetector.conf;

	root	html/Admin;
	
        location / {
		if (-f html/$name/underMaintenance/index.html) {
                        return 503;
                }
		
                index  index.html index.htm;
		try_files $uri $uri/ /index.html;
        }

        include sites-multiple/api/api-admin.conf;

        # redirect server error pages to the static page /50x.html

        error_page 404 /404.html;
        location = /40x.html {
	        #root   /usr/share/nginx/html;
        }

        # redirect server error pages to the static page /50x.html

        error_page 500 502 504 /50x.html;
        location = /50x.html {
                #root   /usr/share/nginx/html;
        }
	error_page 503 /underMaintenance/index.html;
        location /underMaintenance/ {
		root html/$name/underMaintenance/;
        }
}
