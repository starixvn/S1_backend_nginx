#PRD
server {
	listen       5071;
        listen       [::]:5071;
	server_name  backoffice.nova88asia.com backoffice.nova88.net;
        server_tokens  off;
        access_log   off;
	
        location / {
	        root   /var/www/Admin/PRD/;
        }

        include sites-multiple/api/api-admin.conf;  
}

#Release
server {
	listen       7791;
        listen       [::]:7791;
	server_name  backofficerelease.nova88asia.com backofficerelease.nova88.net;
        server_tokens  off;
        access_log   off;
	
	location / {
	        root   /var/www/Admin/Release/;
        }

        include sites-multiple/api/release-api-admin.conf;  
}


