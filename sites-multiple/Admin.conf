server {
	listen       5071;
        listen       [::]:5071;
	server_name  backoffice.nova88asia.com backoffice.nova88.net;
        server_tokens  off;
        access_log   off;
	
        location / {
	        root   /var/www/Admin/PRD/;
                index  index.html index.htm;
                try_files $uri $uri/ /index.html;
                rewrite ^/$ $dirname redirect;
        }

        include sites-multiple/api/ApiAdmin.conf;  
}


