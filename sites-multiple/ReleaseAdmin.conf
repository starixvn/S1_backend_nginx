server {
	listen       7791;
        listen       [::]:7791;
	#server_name  backofficerelease.nova88asia.com backofficerelease.nova88.net;
        server_tokens  off;
        access_log   off;
	
	location / {
	        root   /var/www/Admin/Release/;
                index  index.html index.htm;
                try_files $uri $uri/ /index.html;
        }

        include /etc/nginx/sites-multiple/api/ReleaseApiAdmin.conf;  
}


