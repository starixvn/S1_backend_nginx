server {
        listen       8003;
        listen       [::]:8003;
        server_name  _;
        server_tokens  off;

	include /etc/nginx/sites-multiple/api/serverIPset.conf;

        access_log   off;

        # Load configuration files for the default server block.
        #include /etc/nginx/default.d/*.conf;

	include /etc/nginx/sites-multiple/api/rewriteErrorPage.conf;
        include /etc/nginx/sites-multiple/api/devicedetector.conf;

        location / {
		root   /var/www/$name/landingPage/$style/desktop/;
                if ($Device = Mobile) {
                       	root   /var/www/$name/landingPage/$style/mobile/;
                }
                index  index.html index.htm;
                try_files $uri $uri/ /index.html;
        }

        location /api/ {
                proxy_pass                      http://10.4.194.104:5068/api/;
                proxy_set_header                Host            $host;
                proxy_set_header                X-Real-IP       $remote_addr;
                proxy_set_header                X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header                Cookie $http_cookie;
                proxy_cookie_path / "/; secure; HttpOnly; SameSite=strict";
                proxy_pass_request_headers      on;
                proxy_buffer_size 1024k;
                proxy_buffers 16 1024k;
                proxy_busy_buffers_size 2048k;
                proxy_temp_file_write_size 2048k;
        }

        location ~ /SiteSkin/(.+) {
                proxy_pass                      http://10.4.194.104:5068/SiteSkin/$1;
                proxy_set_header                Host            $host;
                proxy_set_header                X-Real-IP       $remote_addr;
                proxy_set_header                X-Forwarded-For $proxy_add_x_forwarded_for;
                proxy_set_header                Cookie $http_cookie;
                proxy_cookie_path / "/; secure; HttpOnly; SameSite=strict";
                proxy_pass_request_headers      on;
        }

        # redirect server error pages to the static page /40x.html
        
#	error_page 404 /404.html;
        location = /40x.html {
#		root   /usr/share/nginx/html;
        }

        # redirect server error pages to the static page /50x.html
        
#	error_page 500 502 504 /50x.html;
        location = /50x.html {
#		root   /usr/share/nginx/html;
        }
	
#	error_page 503 /underMaintenance/index_$dirname.html;
        location /underMaintenance/ {
#		root /var/www/$name/;
        }
}
