server {
	listen       8000;
        listen       [::]:8000;
	server_name  ~^(?<subdomain>[^.]+).(?<domain>[^$]+);
	server_tokens  off;
	
        include /etc/nginx/sites-multiple/api/serverIPset.conf;

	access_log   off;
#	access_log   /var/log/nginx/testerr.log custom;

	#Load configuration files for the default server block.
        #include /etc/nginx/default.d/*.conf;

	include /etc/nginx/sites-multiple/api/rewriteErrorPage.conf;
	include /etc/nginx/sites-multiple/api/devicedetector.conf;

        if ($Device = Mobile ) {
                rewrite ^(.*)$ https://m.$domain$1 break;
        }

	if ($http_host = "www.nova88.net") {
#		rewrite ^/$ en/ redirect;
		rewrite ^/$ /en/;
	}
	
	if ($http_host = "www.nova88-indo.com") {
		rewrite ^/(.*)$ https://www.nova88-indo.info/$1 permanent;
        }

	if ($http_host = "www.nova88-indo.info") {
#		rewrite ^/$ id/ redirect;
		rewrite ^/$ /id/;
	}

	if ($http_host = "www.nova88gol.com") {
#		rewrite ^/$ cs/ redirect;
		rewrite ^/$ /cs/;
	}

	if ($http_host = "www.nova88apple.com") {
#		rewrite ^/$ th/ redirect;
		rewrite ^/$ /th/;
	}

	location / {

		if ($name = "Goal123") {
#			rewrite ^/$ vn/ redirect;
			rewrite ^/$ /vn/;
                }

		if ($name = "Bwing") {
#			rewrite ^/$ vn/ redirect;
			rewrite ^/$ /vn/;
                }

                root   /var/www/$name/desktop/;
                index  index.html index.htm;
                try_files $uri $uri/ /index.html;
		
#		rewrite ^/$ $dirname/ redirect;
		rewrite ^/$ /$dirname/;
        }

        include /etc/nginx/sites-multiple/api/api.conf;

        # redirect server error pages to the static page /40x.html

#	error_page 404 /404.html;
#        location = /40x.html {
#		root   /usr/share/nginx/html;
#        }

        # redirect server error pages to the static page /50x.html

#	error_page 500 502 504 /50x.html;
#        location = /50x.html {
#		root   /usr/share/nginx/html;
#        }

#	error_page 503 /underMaintenance/index_$dirname.html;
#        location /underMaintenance/ {
#		root /var/www/$name/;
#        }
}
