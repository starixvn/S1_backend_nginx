upstream membersite {
  server 10.4.194.26:7788 weight=1;
  server 10.4.194.27:7788 weight=2;
}

server {
        listen       9500;
        listen       [::]:9500;
        server_name  10.4.194.23;
        server_tokens  off;

        include /etc/nginx/sites-multiple/api/serverIPset.conf;

        access_log   off;

        #Load configuration files for the default server block.

        include /etc/nginx/sites-multiple/api/rewriteErrorPage.conf;
        include /etc/nginx/sites-multiple/api/devicedetector.conf;

        location / {

#                if ($http_host = "release.nova88.net") {
#                       rewrite ^/$ th redirect;
#                }

                root   /var/www/$name/releaseDesktop/;
                index  index.html index.htm;
                try_files $uri $uri/ /index.html;
                rewrite ^/$ $dirname redirect;
        }

        include /etc/nginx/sites-multiple/api/dockerApi.conf;

        # redirect server error pages to the static page /40x.html

#       error_page 404 /404.html;
        location = /40x.html {
#               root   /usr/share/nginx/html;
        }

        # redirect server error pages to the static page /50x.html

#       error_page 500 502 504 /50x.html;
        location = /50x.html {
#               root   /usr/share/nginx/html;
        }

#       error_page 503 /underMaintenance/index_$dirname.html;
        location /underMaintenance/ {
#               root /var/www/$name/;
        }
}