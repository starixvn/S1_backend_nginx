upstream membersite {
  server 10.4.194.26:7788 weight=1;
  server 10.4.194.27:7788 weight=2;
}

server {
#        listen       9500;
#        listen       [::]:9500;
        listen       9000;
        listen       [::]:9000;
        server_name  ~^(?<subdomain>[^.]+).(?<domain>[^$]+); 
        server_tokens  off;

        include /etc/nginx/sites-multiple/api/serverIPset.conf;

        access_log   off;

        #Load configuration files for the default server block.

        include /etc/nginx/sites-multiple/api/rewriteErrorPage.conf;
        include /etc/nginx/sites-multiple/api/devicedetector.conf;

        if ($geoblock_release = 1) {
	        rewrite ^(.*)$ https://$errorUrl/BLOCKIP/index.html break;
        }
        
        if ($Device = Mobile ) {                                   
                rewrite ^(.*)$ https://mrelease.$domain$1 break;   
        }   

        set $last_path_component '';
        if ($request_uri ~* "([^/]*$)" ) {
                set $last_path_component $1;
        }

        set $redirectMaintenance 0;
        if ($releaseMaintenance = on) {
                set $redirectMaintenance 1;
        }
        if ($last_path_component != "um")
        {
                set $redirectMaintenance "$redirectMaintenance,1";
        }
        if ($redirectMaintenance = "1,1")
        {
                rewrite ^(.*)$ https://$subdomain.$domain/um break;
        }

        set $redirectMainPage 0;
        if ($releaseMaintenance = off) {
                set $redirectMainPage 1;
        }
        if ($last_path_component = "um")
        {
                set $redirectMainPage "$redirectMainPage,1";
        }
        if ($redirectMainPage = "1,1")
        {
                rewrite ^(.*)$ https://$subdomain.$domain break;
        }

        if ($http_host = "release.nova88bkk.com") {
                rewrite ^/$ /th/;
        }

        if ($http_host = "release.hasil88.com") {
                rewrite ^/$ /id/;
        }

        if ($http_host = "release.nova88khel.com") {
                rewrite ^/$ /hi/;
        }

        location / {

                root   /var/www/$name/releaseDesktop/;
                index  index.html index.htm;
                try_files $uri $uri/ /index.html;
                rewrite ^/$ $dirname redirect;
        }

        include /etc/nginx/sites-multiple/api/dockerApi.conf;

        # redirect server error pages to the static page /40x.html

#       error_page 404 /404.html;
        location = /40x.html {
#               root   /usr/share/nginx/html;
        }

        # redirect server error pages to the static page /50x.html

#       error_page 500 502 504 /50x.html;
        location = /50x.html {
#               root   /usr/share/nginx/html;
        }

#       error_page 503 /underMaintenance/index_$dirname.html;
        location /underMaintenance/ {
#               root /var/www/$name/;
        }
}
