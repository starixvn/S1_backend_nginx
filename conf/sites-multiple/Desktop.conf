server {
	listen       8000;
        listen       [::]:8000;
        server_name  ~^(?<subdomain>[^.]+).(?<domain>[^$]+);
        server_tokens  off;
        access_log   off;
	#Load configuration files for the default server block.
        #include /etc/nginx/default.d/*.conf;

	include sites-multiple/api/devicedetector.conf;

	root	html/$name/$Device;
	
        set $maintain 0;	
        #Desktop	
	location ~* ^/(.*)/um/? {
                if ($maintain = 0) {
            	        rewrite ^/(.*)/um/$ /$1 redirect;
                } 		                  
        }
        #Mobile
        location ~* ^/underMaintenance/(.*)/? {
                if ($maintain = 0) {	
            	        rewrite ^(.*)$ 	 / redirect;	
                }	                   
        }
	#排除導轉的副檔名
	location ~* \.(js|css|jpg|jpeg|png|woff|json|map)$ {
	}

        location / {
                set $flag 0;
                if ($maintain = 1) {	
                        set $flag "$Device,1";	
		}
                if ($flag = "Desktop,1") {
                        rewrite ^/(vn|en|cs|th|id|hi)$ 	/$1/um/ redirect;
		        rewrite ^(.*)$ 	                /en/um/ redirect;		
                }
                if ($flag = "Mobile,1") {
                        rewrite ^/(vn|en|cs|th|id|hi)$ 	/underMaintenance/$1/ redirect;
		        rewrite ^(.*)$ 	                /underMaintenance/en/ redirect;		
                }       

		if (-f html/$name/underMaintenance/index.html) {
                        return 503;
                }
		
                index  index.html index.htm;
		try_files $uri $uri/ /index.html;
        }

        include sites-multiple/api/api.conf;

        # redirect server error pages to the static page /50x.html

        error_page 404 /404.html;
        location = /40x.html {
	        #root   /usr/share/nginx/html;
        }

        # redirect server error pages to the static page /50x.html

        error_page 500 502 504 /50x.html;
        location = /50x.html {
                #root   /usr/share/nginx/html;
        }
	error_page 503 /underMaintenance/index.html;
        location /underMaintenance/ {
		root html/$name/underMaintenance/;
        }
}
