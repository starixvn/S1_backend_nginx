server {
	listen       8000;
        listen       [::]:8000;
        server_name  ~^(?<subdomain>[^.]+).(?<domain>[^$]+);
        server_tokens  off;
        access_log   off;
	#Load configuration files for the default server block.
        #include /etc/nginx/default.d/*.conf;

	include sites-multiple/api/devicedetector.conf;

	root    html/$name/$Device;

        location /_next/ {
                root html/rewards/;
        }
        
	location /rewards {
                root html/;
		try_files  $uri $uri/ $uri/index.html $uri.html;
        }

        location  /test {
            root html/test.html;
	}

        #for rewrite test
        add_header Cache-Control no-store;
        add_header Pragma no-cache;
	#rewrite_log on;
	#error_log logs/rewrite.log notice;	
	
        set $testVnMaintain 0;
        
        location ~* ^/underMaintenance/(.*)/? {
                if ($underMaintenance = off) {	
            	        rewrite ^(.*)$ 	 / redirect;	
                }	                   
        }
	#排除導轉的副檔名
	location ~* \.(js|css|jpg|jpeg|png|woff|json|map)$ {
	}

        #BLOCKIP 
        location ^~ /BLOCKIP/ {
                if ($geoblock = 0) {
                        rewrite /BLOCKIP/  / redirect;
                } 
                index  index.html index.htm;
		try_files $uri $uri/ /index.html;
        }

        location / {            
                if ($geoblock = 1) {
                       rewrite ^(.*)$ /BLOCKIP/ redirect;
                } 
                
                if ($underMaintenance = on) {	
                        rewrite ^/(vn|en|cs|th|id|hi|hi_en|id_en|th_en)$ 	/underMaintenance/$1/ redirect;
		        rewrite ^(.*)$ 	                                        /underMaintenance/en/ redirect;		
		}
                if ($name = "Bwing") {
                        set $testVnMaintain 'vn';
                }
                # if ($name = "Goal123") {
                #         set $testVnMaintain 'vn';
                # }
                if ($bwingTest = on) {
                        set $testVnMaintain "${testVnMaintain}Maintain";
                }
                if ($testVnMaintain = 'vnMaintain') {
                        rewrite ^(.*)$ /underMaintenance/vn/ redirect;	
                }

		if (-f html/$name/underMaintenance/index.html) {
                        return 503;
                }
		
                index  index.html index.htm;
		try_files $uri $uri/ /index.html;
                #try_files  $uri $uri/  @check_mobile;
        }

        location @check_mobile {
        set $mlang "";

        # Check if the URI matches specific language codes at the base path
        if ($uri ~* ^/(vn|en|cs|th|id|hi|hi_en|id_en|th_en)$) {
             set $mlang $1;
        }

        # # If the device is Mobile and the language code matches
        if ($Device ~* ^(Desktop)^) {
            set $mlang "";
        }

        if ($mlang != "") {
            rewrite ^ / redirect;
        }

        try_files $uri $uri/ @handle_404;
        }

        location @handle_404 {
        # Extract language code from URI
        if ($uri ~* ^/(vn|en|cs|th|id|hi|hi_en|id_en|th_en)(/.*)?$) {
            set $lang $1;
        }

        if ($lang = null){
           set $lang "en";
        }

        # Default 404 if language code is not matched
        if ($Device ~* ^(Desktop)^) {
             rewrite ^ /404/$lang/ redirect;
        }
        try_files $uri $uri/ /index.html;
        }

        include sites-multiple/api/api.conf;

        # redirect server error pages to the static page /50x.html

        error_page 404 /404.html;
        location = /40x.html {
	        #root   /usr/share/nginx/html;
        }

        # redirect server error pages to the static page /50x.html

        error_page 500 502 504 /50x.html;
        location = /50x.html {
                #root   /usr/share/nginx/html;
        }
	error_page 503 /underMaintenance/index.html;
        location /underMaintenance/ {
		root html/$name/underMaintenance/;
        }
}
