server {
	listen       8001;
        listen       [::]:8001;
        server_name  ~^(?<subdomain>[^.]+).(?<domain>[^$]+);
        server_tokens  off;
	access_log   off;

        #Load configuration files for the default server block.
        #include /etc/nginx/default.d/*.conf;

        include /etc/nginx/sites-multiple/api/devicedetector.conf;

        
        if ($Device = Desktop ) {
                rewrite ^(.*)$ https://www.$domain break;
        }

        location / {
		if (-f /var/www/$name/underMaintenance/index.html) {
                        return 503;
                }

                root   /var/www/$name/mobile/;
                index  index.html index.htm;
                try_files $uri $uri/ /index.html;
        }

        include /etc/nginx/sites-multiple/api/api.conf;

        # redirect server error pages to the static page /50x.html

        error_page 404 /404.html;
        location = /40x.html {
	        #root   /usr/share/nginx/html;
        }

        # redirect server error pages to the static page /50x.html

        error_page 500 502 504 /50x.html;
        location = /50x.html {
                #root   /usr/share/nginx/html;
        }

	error_page 503 /underMaintenance/index.html;
        location /underMaintenance/ {
		root /var/www/$name/underMaintenance/;
        }
}
