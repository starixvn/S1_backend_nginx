#### 先用 x_forwarded_for 第一組來當用戶 IP，抓不到用 remote_addr 當 IP

map $http_x_forwarded_for $real_ip {
        ~^(\d+\.\d+\.\d+\.\d+) $1;
        default $remote_addr;
}

#### 白名單 IP  0:為開放 1:為封鎖
#geo $remote_addr $ip_geoblock {
geo $real_ip $ip_geoblock {     
        default 0;
}