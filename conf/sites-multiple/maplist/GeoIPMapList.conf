#### 先用 x_forwarded_for 第一組來當用戶 IP，抓不到用 remote_addr 當 IP

map $http_x_forwarded_for $real_ip {
        ~^(\d+\.\d+\.\d+\.\d+) $1;
        default $remote_addr;
}

