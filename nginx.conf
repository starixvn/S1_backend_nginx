# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

#load_module "modules/ngx_http_geoip_module.so";
load_module /etc/nginx/modules/ngx_http_geoip_module.so;

#user nginx;
user root;
worker_processes auto;
error_log /var/log/nginx/error.log;
pid /var/run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
include /usr/share/nginx/modules/*.conf;

#load_module "modules/ngx_http_geoip_module.so";

events {
    worker_connections 1024;
}

http {

#	log_format custom 'name:$name - dirname:$dirname - subdomain:$subdomain - domain:$domain - http_referer:$http_referer - query_string:$query_string - uri:$uri - request:$request - request_uri:$request_uri - http_host:$http_host';
	log_format custom 'geoblock - $geoblock , underMaintenance - $underMaintenance , geoip_country_code - $geoip_country_code , releaseMaintenance - $releaseMaintenance';

	#log_format custom '$dirname/$default_geoblock/$geoblock/$underMaintenance/$errorUrl';
	log_format main  '$geoip_country_code - $realip_remote_addr - $remote_addr - $remote_user [$time_local] "$request" '
			'$status $body_bytes_sent "$http_referer" $server_port '
			'"$http_user_agent" "$http_x_forwarded_for" $request_time';

#	log_format  main  'remote_addr: $remote_addr, remote_user: $remote_user [time_local: $time_local] request: "$request" '
#                      	  'status: $status, body_bytes_sent: $body_bytes_sent, http_referer: "$http_referer" '
#                      	  'http_user_agent: "$http_user_agent:", http_x_forwarded_for: "$http_x_forwarded_for" '
#			  'geoip_area_code: $geoip_area_code, geoip_city: $geoip_city, geoip_city_continent_code: $geoip_city_continent_code, geoip_city_country_code: $geoip_city_country_code, geoip_city_country_code3: $geoip_city_country_code3, geoip_city_country_name: $geoip_city_country_name, geoip_country_code: $geoip_country_code, geoip_country_code3: $geoip_country_code3, geoip_country_name: $geoip_country_name, geoip_dma_code: $geoip_dma_code, geoip_latitude: $geoip_latitude, geoip_longitude: $geoip_longitude, geoip_org: $geoip_org, geoip_postal_code: $geoip_postal_code, geoip_region: $geoip_region, geoip_region_name: $geoip_region_name';


    access_log  /var/log/nginx/access.log  main;
    client_max_body_size 10M;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   65;
    types_hash_max_size 2048;

    include             /etc/nginx/mime.types;
    default_type        application/octet-stream;
    geoip_country /usr/share/GeoIP/GeoIP.dat;

    add_header X-Frame-Options SAMEORIGIN always;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    #include /etc/nginx/conf.d/*.conf;

    # index   index.html index.htm;


	port_in_redirect off;
        include /etc/nginx/sites-multiple/Admin.conf;
        include /etc/nginx/sites-multiple/release-Admin.conf;

        include /etc/nginx/sites-multiple/maplist/*.conf;
        include /etc/nginx/sites-multiple/*.conf;
}
