---

version: '3'

services:
  nginx:
    image: nginx:1.18.0
    networks:
      - nginx-net
    ports:
      - "5071:5071"
      - "7791:7791"

    volumes:
      - nginx:/etc/nginx
      - GeoIP:/usr/share/GeoIP
      - www:/var/www/

networks:
  nginx-net:
    driver: bridge

volumes:
  nginx:
  GeoIP:
  www:
