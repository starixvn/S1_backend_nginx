---

version: '3'

services:
  nginx:
    container_name: nginx
    image: nginx:1.18.0
    networks:
      - nginx-net
    ports:
      - "5071:5071"
      - "7791:7791"

    volumes:
      - /nginx:/etc/nginx
      - /usr/share/GeoIP:/usr/share/GeoIP
      - /var/www/:/var/www/
    restart: always

networks:
  nginx-net:
    driver: bridge