# For more information on configuration, see:
#   * Official English Documentation: http://nginx.org/en/docs/
#   * Official Russian Documentation: http://nginx.org/ru/docs/

#user nginx;
worker_processes auto;
#error_log /var/log/nginx/error.log;
#pid /var/run/nginx.pid;

# Load dynamic modules. See /usr/share/doc/nginx/README.dynamic.
#include /usr/share/nginx/modules/*.conf;

events {
    worker_connections 1024;
}

http {
#    log_format  main  '$remote_addr - $remote_user [$time_local] "$request" '
#                      '$status $body_bytes_sent "$http_referer" $server_port '
#                      '"$http_user_agent" "$http_x_forwarded_for" $request_time';

#    access_log  /var/log/nginx/access.log  main;
    client_max_body_size 10M;
    sendfile            on;
    tcp_nopush          on;
    tcp_nodelay         on;
    keepalive_timeout   120;
    types_hash_max_size 2048;

    include             mime.types;
    default_type        application/octet-stream;

    # Load modular configuration files from the /etc/nginx/conf.d directory.
    # See http://nginx.org/en/docs/ngx_core_module.html#include
    # for more information.
    #include /etc/nginx/conf.d/*.conf;

    # index   index.html index.htm;
	server {
		listen       80;
		server_name  www.n88dev.com stag.bwing.com stag.goal123.com;
		location / {
			proxy_pass http://localhost:8000;
			proxy_set_header                Host            $host;
		        proxy_set_header                X-Real-IP       $remote_addr;
		        proxy_set_header                X-Forwarded-For $proxy_add_x_forwarded_for;
		        proxy_set_header                Cookie $http_cookie;
#		        proxy_cookie_path / "/; secure; HttpOnly; SameSite=strict";
		        proxy_pass_request_headers      on;
			proxy_buffer_size 1024k;
			proxy_buffers 16 1024k;
			proxy_busy_buffers_size 2048k;
			proxy_temp_file_write_size 2048k;
		}
	}

	server {
		listen       80;
		server_name  app.n88dev.com;
		location / {
			proxy_pass http://localhost:5070;
			proxy_set_header                Host            $host;
		        proxy_set_header                X-Real-IP       $remote_addr;
		        proxy_set_header                X-Forwarded-For $proxy_add_x_forwarded_for;
		        proxy_set_header                Cookie $http_cookie;
#		        proxy_cookie_path / "/; secure; HttpOnly; SameSite=strict";
		        proxy_pass_request_headers      on;
			proxy_buffer_size 1024k;
			proxy_buffers 16 1024k;
			proxy_busy_buffers_size 2048k;
			proxy_temp_file_write_size 2048k;
			proxy_connect_timeout 300s;
			proxy_read_timeout 300s;
			proxy_send_timeout 300s;
		}
	}

server {
		listen       80;
		server_name  admin.n88dev.com;
		location / {
			proxy_pass http://localhost:5069;
			proxy_set_header                Host            $host;
		        proxy_set_header                X-Real-IP       $remote_addr;
		        proxy_set_header                X-Forwarded-For $proxy_add_x_forwarded_for;
		        proxy_set_header                Cookie $http_cookie;
#		        proxy_cookie_path / "/; secure; HttpOnly; SameSite=strict";
		        proxy_pass_request_headers      on;
			proxy_buffer_size 1024k;
			proxy_buffers 16 1024k;
			proxy_busy_buffers_size 2048k;
			proxy_temp_file_write_size 2048k;
			proxy_connect_timeout 300s;
			proxy_read_timeout 300s;
			proxy_send_timeout 300s;
		}
	}

#payment.n88dev.com


	port_in_redirect off;

        include sites-multiple/maplist/DomainSiteMapList.conf;
        include sites-multiple/Desktop.conf;

}
